# Apply after docker-compose.yaml. Requires Docker Compose >= 2.24.4.
x-aamu-environment: &aamu-environment
  PENPOT_FLAGS: disable-email-verification enable-smtp enable-prepl-server enable-secure-session-cookies enable-mcp enable-webhooks
  PENPOT_PUBLIC_URI: /designs/penpot

volumes:
  penpot_postgres_data_pg16:

services:
  penpot-frontend:
    image: "aamuapp/penpot_frontend:latest"
    ports: !override
      - "3449:8080"
    dns:
      - 8.8.8.8
    volumes:
      - ./files/nginx-aamu-subpath.conf:/etc/nginx/overrides/server.d/aamu-subpath.conf:ro
    environment:
      <<: *aamu-environment

  penpot-backend:
    image: "aamuapp/penpot_backend:${PENPOT_VERSION:-latest}"
    environment:
      <<: *aamu-environment
      PENPOT_SECRET_KEY2: ${PENPOT_SECRET_KEY2}
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY}
      PENPOT_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: !reset null
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      PENPOT_OBJECTS_STORAGE_BACKEND: s3
      PENPOT_OBJECTS_STORAGE_S3_REGION: us-east-2
      PENPOT_OBJECTS_STORAGE_S3_ENDPOINT: https://s3.us-east-2.amazonaws.com
      PENPOT_OBJECTS_STORAGE_S3_BUCKET: aamu-penpot

  penpot-admin-console:
    environment:
      PENPOT_PUBLIC_URI: /designs/penpot

  penpot-exporter:
    image: "aamuapp/penpot_exporter:${PENPOT_VERSION:-latest}"
    ports:
      - "6061:6061"
    environment:
      PENPOT_FLAGS: !reset null
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY}
      PENPOT_PUBLIC_URI: http://penpot-frontend:8080

  penpot-postgres:
    image: "postgres:16"
    # Keep the existing PG16 data volume and replace the upstream mount.
    volumes: !override
      - penpot_postgres_data_pg16:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
