# Apply after docker-compose.yaml and docker-compose.aamu.yaml.
services:
  penpot-mcp:
    image: "aamuapp/penpot_mcp:${PENPOT_VERSION:-latest}"
    ports:
      - "4401:4401"
      - "4402:4402"
    environment:
      PENPOT_MCP_SERVER_LISTEN_ADDRESS: 0.0.0.0
      PENPOT_MCP_SERVER_ADDRESS: ${PENPOT_MCP_SERVER_ADDRESS:-localhost}
      PENPOT_MCP_SERVER_PORT: 4401
      PENPOT_MCP_WEBSOCKET_PORT: 4402
      PENPOT_MCP_REMOTE_MODE: true

  penpot-mcp-plugin:
    image: "aamuapp/penpot_mcp_plugin:${PENPOT_VERSION:-latest}"
    restart: always
    depends_on:
      - penpot-mcp
    networks:
      - penpot
    ports:
      - "4400:80"

  penpot-postgres:
    ports: !reset []
